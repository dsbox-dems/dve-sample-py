# ============================================================
# Build system (PEP 518 / PEP 517)
# ============================================================
[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"
##@(uv): requires = ["hatchling>=1.21"]
##@(uv): build-backend = "hatchling.build"
##@(poetry): requires = [
##@(poetry):    "poetry-core>=2.0",
##@(poetry):    "setuptools",
##@(poetry):    "wheel",
##@(poetry):    "incremental",
##@(poetry):]
##@(poetry):build-backend = "poetry.core.masonry.api"

# ============================================================
# Project metadata (PEP 621)
# ============================================================
[project]
name = "dve_sample_py"
version = "0.1.0"
description = "Reproducible experiments for [Paper Title]"
readme = "README.md"
# license-files = [
#     {file = "LICENSE"},
#     {file = "LICENSE.md"},
# ]
requires-python = ">=3.10,<3.15"

authors = [
    {name = "Datalab DEMS", email = "datalab@unimib.it"},
]

# }}} //
