# {{{ ////////////////////////////////////////////////////////////////

# ============================================================
# Tool configuration (non-standard, tool-specific tables)
# ============================================================

# --- [uv] ---------------------------------------------------

[tool.uv]
# Treat this directory as an installable package
package = true

[tool.uv.sources]
torch = { index = "torch130" }
torchvision = { index = "torch130" }

[[tool.uv.index]]
name = "torch130"
url = "https://download.pytorch.org/whl/cu130"


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/*"]

# --- [poetry] ---------------------------------------------------

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "*", from = "src" }]

[[tool.poetry.source]]
name = "torch130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "torch130"}
torchvision = {source = "torch130"}

[tool.poetry.dependencies.rootpath]
git = "https://github.com/hute37/python-rootpath"
branch = "stable"



# --- [setuptools] ---------------------------------------------------

# [tool.setuptools.packages.find]
# where   = ["src"]
# include = ["*"]

# [tool.setuptools]
# include-package-data = true

# [tool.setuptools.package-data]
# res = ["resources/*", "resources/*/*"]


# --- [pytest] ---------------------------------------------------

[tool.pytest.ini_options]
pythonpath   = ["src", "tests/pytest"]
testpaths    = ["tests/pytest"]
python_files = ["test_*.py"]
python_classes  = ["Test*"]
python_functions = ["test_*"]
addopts      = "-v --tb=short"



# --- [mypy] ---------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true


# --- [pyright] ---------------------------------------------------

[tool.pyright]
include = ["src", "tests/pytest", "notebooks"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "docker",
    "notes",
    "data",
    "logs",
    "temp",
]
ignore              = ["build"]
defineConstant      = {DEBUG = true}
typeCheckingMode    = "basic"
reportMissingImports = true


# --- [ruff] ---------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
fix            = true

[tool.ruff.lint]
unfixable      = []
typing-modules = ["pandas._typing"]
exclude = [
  "notebooks/@databricks/*",
  "doc/*",
  ".eggs/*.py",
  "home/*",
  "notes/*",
  "renv/*",
  ".venv/*",
]
select = [
    "F","E","W","YTT","B","Q","T10","INT","PL","PT","PIE","PYI",
    "TID","ISC","TCH","C4","PGH","RUF","S102","NPY002","PERF",
    "FLY","G","FA","ICN001","SLOT","RSE",
]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports       = true
#split-on-trailing-comma  = false


[tool.ruff.format]
docstring-code-format = true

# }}} //
# {{{ ////////////////////////////////////////////////////////////////

# ============================================================
# Project Custom Configuration
# ============================================================

[tool.local]
has_config = true
config = "config.yaml"

[tool.local.paths]
log_dir = "logs"

[tool.local.log]
level = "INFO"

[tool.local.hello]
salutation = "Hi"


