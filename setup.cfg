[metadata]
name = dve_sample_py
version = 0.1.0
author = Datalab DEMS
author_email = datalab@unimib.it
description = Reproducible experiments for [Paper Title]
long_description = file: README.rst
long_description_content_type = text/x-rst
url = https://gitlab.com/ub-dems-public/ds-labs/dve-sample-py
project_urls =
    Bug Tracker = https://gitlab.com/ub-dems-public/ds-labs/dve-sample-py/-/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: AFL License
    Operating System :: OS Independent

[options]
package_dir =
    = src
zip_safe = True
include_package_data = True
packages = find:
python_requires = >=3.10

install_requires =
    numpy
    pyyaml
    piny

tests_require =
    pytest

entry_points =
    [console_scripts]
    dve = dve.cli:main

[options.packages.find]
where = src

[options.package_data]
res = resources/*, resources/*/*


[tool:pytest]
minversion = 6.0
addopts = -ra -q
testpaths =
    tests/pytest
    
